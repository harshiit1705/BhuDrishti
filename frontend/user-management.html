<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BhuDrishti — User Management</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet"><script src="js/api-client.js?v=20261001-auth1"></script></head><body class="bg-[#f7f9f7] text-gray-900"><main class="max-w-6xl mx-auto p-6 md:p-10"><div class="flex items-center justify-between gap-4 mb-8"><div><div class="text-xs uppercase tracking-widest text-green-700 font-semibold">Administration</div><h1 class="text-3xl font-bold mt-1">User Management</h1><p class="text-gray-500 mt-1">Activate or suspend BhuDrishti accounts.</p></div><div class="flex gap-2"><a href="dashboard.html" class="px-4 py-2 rounded-lg border bg-white">Dashboard</a><button id="logout" class="px-4 py-2 rounded-lg bg-gray-900 text-white">Logout</button></div></div><div id="who" class="mb-5 text-sm text-gray-600"></div><div id="msg" class="hidden mb-5 p-3 rounded-lg"></div><div class="bg-white border rounded-2xl overflow-hidden"><div class="overflow-x-auto"><table class="min-w-full text-sm"><thead class="bg-gray-50"><tr><th class="text-left p-4">User</th><th class="text-left p-4">Role</th><th class="text-left p-4">Employee</th><th class="text-left p-4">Status</th><th class="text-left p-4">Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script>
const rows=document.getElementById('rows'),msg=document.getElementById('msg');function show(t,e=false){msg.textContent=t;msg.className='mb-5 p-3 rounded-lg '+(e?'bg-red-50 text-red-700':'bg-green-50 text-green-700');}
(async()=>{try{const me=await BhuDrishtiAPI.me();if(me.user.role!=='ADMIN'){location.href='dashboard.html';return;}document.getElementById('who').textContent=`Signed in as ${me.user.name} • ${me.user.role_label}`;const r=await BhuDrishtiAPI.getUsers();rows.innerHTML=r.users.map(u=>`<tr class="border-t"><td class="p-4"><div class="font-semibold">${u.name}</div><div class="text-gray-500">${u.email}</div></td><td class="p-4">${u.role_label}</td><td class="p-4">${u.employee_id||'—'}</td><td class="p-4"><span class="px-2 py-1 rounded-full bg-gray-100">${u.status}</span></td><td class="p-4">${u.status==='PENDING'||u.status==='SUSPENDED'?`<button data-id="${u.user_id}" data-status="ACTIVE" class="activate px-3 py-1.5 rounded-lg bg-green-700 text-white">Activate</button>`:u.email!=='admin@bhudrishti.gov.in'?`<button data-id="${u.user_id}" data-status="SUSPENDED" class="suspend px-3 py-1.5 rounded-lg border">Suspend</button>`:'Protected'}</td></tr>`).join('');document.querySelectorAll('[data-status]').forEach(b=>b.onclick=async()=>{try{await BhuDrishtiAPI.setUserStatus(b.dataset.id,b.dataset.status);location.reload();}catch(e){show(e.message,true);}});}catch(e){show(e.message,true);}})();document.getElementById('logout').onclick=()=>BhuDrishtiAPI.logout();
</script></body></html>
